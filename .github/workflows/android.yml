name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

# 同一分支连续 push 时，取消上一次还在跑的构建
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  debug:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # 预装 compileSdk 37 省点时间。装不上也不要紧：
      # 构建时 AGP 会自己补（许可证在下一步统一接受）
      - name: Install SDK platform 37
        continue-on-error: true
        run: sdkmanager "platforms;android-37"

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # 通过网页上传的仓库会丢失可执行位，这里补一下
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Write build summary
        if: success()
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          {
            echo "### Debug APK"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 版本 | $(sed -n 's/.*versionName = \"\(.*\)\".*/\1/p' app/build.gradle.kts | head -1) |"
            echo "| 提交 | \`${GITHUB_SHA:0:7}\` |"
            echo "| 大小 | $(du -h "$APK" | cut -f1) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: radio-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
